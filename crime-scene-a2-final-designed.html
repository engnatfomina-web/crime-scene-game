<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crime Scene Investigator — A2 Grammar Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e2d5;color:#20252b;font-family:Arial,sans-serif}
#game{max-width:900px;margin:auto;padding:24px}.top{background:#172331;color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:#e5c77b;margin-bottom:6px}h1{margin:0;font-size:30px}.score{border:1px solid #ffffff40;border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap}
.case{margin-top:18px;background:#fffdf7;border:1px solid #d8d0c2;border-radius:18px;padding:24px}.case-no{font-size:12px;letter-spacing:.16em;font-weight:900;color:#6d747b}
.scene{background:#eee8dc;border-left:4px solid #d6a84f;padding:15px 17px;border-radius:8px;line-height:1.55;margin:12px 0 20px}
.question{font-size:19px;font-weight:800;margin-bottom:14px}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{border:1px solid #d4cbbb;background:#fff;border-radius:11px;padding:14px;text-align:left;font-size:15px;line-height:1.4;cursor:pointer;min-height:58px}
.option:hover{border-color:#a99164}.option:disabled{cursor:default}.option.correct{border-color:#3f7656;background:#edf6f0}.option.wrong{border-color:#9b4b43;background:#f9eeee}
.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:10px;background:#f0ece4;line-height:1.55}.feedback.show{display:block}.feedback.good{border-left:4px solid #3f7656}.feedback.bad{border-left:4px solid #9b4b43}
.grammar{margin-top:16px;background:#f7f3eb;border-radius:12px;padding:13px 15px;font-size:14px;color:#4e555c}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;flex-wrap:wrap}.progress{font-size:13px;color:#6d747b;font-weight:700}
.next,.restart{border:0;background:#172331;color:#fff;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}
.result{margin-top:18px;background:#172331;color:#fff;border-radius:18px;padding:32px;text-align:center}.big{font-size:48px;font-weight:900;color:#e5c77b}
.rank{display:inline-block;background:#ffffff18;border-radius:20px;padding:7px 13px;font-weight:800;margin:8px 0 15px}.result p{line-height:1.6;color:#eee}
@media(max-width:650px){#game{padding:14px}.top{flex-direction:column;align-items:flex-start}h1{font-size:25px}.options{grid-template-columns:1fr}.case{padding:18px}}

/* Detective-file visual upgrade */
body{
 background:
 radial-gradient(circle at 12% 8%,rgba(214,168,79,.12),transparent 28%),
 radial-gradient(circle at 90% 88%,rgba(23,35,49,.08),transparent 30%),#e9e2d5;
}
#game{position:relative}
#game:before{
 content:"CONFIDENTIAL • EVIDENCE ROOM";
 position:absolute;right:28px;top:5px;font-size:9px;letter-spacing:.18em;
 font-weight:900;color:#8a806e;transform:rotate(-2deg);
}
.top{position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(23,35,49,.12)}
.top:after{
 content:"";position:absolute;right:-28px;bottom:-48px;width:135px;height:135px;
 border:2px solid rgba(229,199,123,.18);border-radius:50%;
 box-shadow:0 0 0 12px rgba(229,199,123,.06),0 0 0 24px rgba(229,199,123,.04);
}
.eyebrow:before{content:"◈  ";font-size:10px}
.case{position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(32,37,43,.08)}
.case:before{
 content:"EVIDENCE";position:absolute;right:-22px;top:18px;padding:5px 30px;
 background:#e5c77b;color:#172331;font-size:9px;letter-spacing:.16em;
 font-weight:900;transform:rotate(6deg);
}
.case-no:after{content:"  •  FILED";color:#a08f70;font-size:10px;letter-spacing:.12em}
.scene{
 position:relative;background:linear-gradient(135deg,#eee8dc,#f5f0e7);
 border-left-width:5px;
}
.scene:after{
 content:"⌕";position:absolute;right:16px;top:7px;font-size:30px;
 font-weight:900;color:#8a806e;opacity:.28;transform:rotate(-15deg);
}
.options .option{position:relative;transition:transform .15s,box-shadow .15s,border-color .15s}
.options .option:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(32,37,43,.09)}
.option b{color:#8a6b2d}
.feedback{position:relative}
.feedback:before{
 content:"CASE NOTE";display:block;font-size:9px;letter-spacing:.15em;
 font-weight:900;color:#8a806e;margin-bottom:5px;
}
.grammar{border:1px dashed #d2c6b3;position:relative}
.grammar:before{
 content:"GRAMMAR EVIDENCE";display:block;font-size:9px;letter-spacing:.14em;
 font-weight:900;color:#8a806e;margin-bottom:5px;
}
.next,.restart{box-shadow:0 4px 10px rgba(23,35,49,.14)}
.progress:before{content:"▸  ";color:#b28a39}
.result{position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(23,35,49,.16)}
.result:before{
 content:"CASE CLOSED";position:absolute;top:18px;right:-25px;padding:6px 30px;
 background:#e5c77b;color:#172331;font-size:9px;font-weight:900;
 letter-spacing:.15em;transform:rotate(5deg);
}

</style>
</head>
<body>
<div id="game">
<div class="top"><div><div class="eyebrow">CASE FILE • A2 GRAMMAR</div><h1>Crime Scene Investigator</h1></div><div class="score" id="score">Score: 0 / 10</div></div>
<div id="screen"></div>
</div>
<script>
const cases=[
{scene:"A kitchen window is broken. There is glass on the floor and a muddy footprint inside the kitchen. The front door is still locked.",q:"What can the detective conclude?",o:["The burglar must have been outside.","The burglar must have been in the kitchen.","The burglar must have been looking for a way out.","The burglar must have been tired."],a:1,w:"The footprint is inside the kitchen, while the front door is locked. The evidence places the burglar in the kitchen.",g:"must have been + place → a conclusion about a past location."},
{scene:"It is 10:00 p.m. The office is empty. At 10:05, a new email is sent from the office computer. When the detective arrives, the computer is still warm.",q:"What is the strongest conclusion?",o:["Someone must have been using the computer.","Someone must have been waiting for the manager.","Someone must have been in the kitchen.","Someone must have been stealing the laptop."],a:0,w:"A new email was sent and the computer is warm. The evidence points to an activity in progress shortly before the detective arrived.",g:"must have been + verb-ing → a conclusion about an activity in progress."},
{scene:"The museum closes at 6:00 p.m. At 6:20, the security alarm starts ringing. A small painting is missing from the wall. A ladder is standing under the empty space, and there are fresh fingerprints on the frame.",q:"What must the thief have been doing?",o:["The thief must have been waiting for the museum to close.","The thief must have been looking at the painting.","The thief must have been taking the painting off the wall.","The thief must have been in the museum café."],a:2,w:"The ladder, the empty space on the wall and the fresh fingerprints all suggest that the thief was taking the painting off the wall.",g:"must have been + verb-ing → an activity you infer from several clues."},
{scene:"At 7:30 a.m., a neighbour sees a man get into a car and drive away. He does not go to work. The car is later found several kilometres away. The owner says he had not planned to go anywhere.",q:"What is the most likely conclusion?",o:["The owner must have been driving to work.","The owner must have been driving to put petrol in the car.","Someone must have been stealing the car.","The owner must have been driving to buy some coffee."],a:2,w:"The owner says he had no plans, yet someone drove the car away and it was found elsewhere. Theft best explains all the clues.",g:"must have been + verb-ing → an activity you infer from evidence."},
{scene:"It is raining heavily. A man arrives at a house. His coat and shoes are soaking wet, but the clothes underneath his coat are dry.",q:"What must be true?",o:["He must have been exhausted.","He must have been wet.","He must have been in a hurry.","He must have been angry."],a:1,w:"His coat and shoes are soaking wet. We have direct evidence of his physical state.",g:"must have been + adjective → a conclusion about a past state."},
{scene:"A security camera shows a man standing in front of a safe at 1:15 a.m. He is holding a key. At 1:17, the safe is open and the money is gone.",q:"What must he have been doing?",o:["He must have been checking the alarm.","He must have been opening the safe.","He must have been looking for his keys.","He must have been waiting for the police."],a:1,w:"He had the key, was standing at the safe, and two minutes later it was open. The evidence strongly points to him opening it.",g:"must have been + verb-ing → an activity in progress in the past."},
{scene:"A man says he never entered the office. His phone is found on the desk inside. Security footage shows him arriving at 8:45 p.m. At 8:50, the office door closes. Nobody else enters the office that evening.",q:"Where must the man have been?",o:["He must have been waiting outside the office.","He must have been in the office.","He must have been using his phone.","He must have been looking for his phone."],a:1,w:"The camera shows him entering, the office door closes, and nobody else enters. His phone is also inside. The evidence places him in the office.",g:"must have been + place → a conclusion about a past location."},
{scene:"At 3:00 a.m., a security camera records a person near the back door of a shop. The person checks the street twice, takes out a key, unlocks the door and slowly goes inside. The shop is closed until 8:00 a.m.",q:"What was the person most likely doing?",o:["The person must have been opening the shop for customers.","The person must have been looking for a friend.","The person must have been entering the shop secretly.","The person must have been waiting for the shop to open."],a:2,w:"The person checks the street, uses a key at 3 a.m. and enters when the shop is closed. Entering secretly best explains all the clues.",g:"must have been + verb-ing → an activity you infer from several clues."},
{scene:"The police arrive at a house, but the man has already left. His wife says he suddenly realised that he had forgotten his car keys and went back inside to get them. A pair of wet footprints leads from the bedroom to the front door. His coat and shoes are next to the bed.",q:"Where must the man have been?",o:["He must have been in the bedroom.","He must have been in the garden.","He must have been waiting outside.","He must have been in the kitchen."],a:0,w:"He went back inside to get his car keys. His coat and shoes are next to the bed, and the wet footprints begin in the bedroom. The evidence places him there.",g:"must have been + place → a conclusion about a past location."},
{scene:"At midnight, a neighbour sees a person behind the curtains. The lights are off. The person moves slowly and then disappears from the window.",q:"What is the best conclusion?",o:["The person must have been hiding.","The person must have been sleeping.","The person must have been watching TV.","The person must have been getting ready for work."],a:0,w:"The person is behind closed curtains, in the dark, moving carefully, and disappears from view. Hiding is the best explanation.",g:"must have been + verb-ing → an activity you infer from several clues."}
];

let current=0,score=0,answered=false;
const screen=document.getElementById("screen"),scoreEl=document.getElementById("score");

function render(){
 answered=false;const c=cases[current];
 screen.innerHTML='<section class="case"><div class="case-no">CASE '+String(current+1).padStart(2,"0")+' / 10</div><div class="scene"><b>Evidence report</b><br>'+c.scene+'</div><div class="question">'+c.q+'</div><div class="options">'+c.o.map((x,i)=>'<button type="button" class="option" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join("")+'</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="grammar"><b>Grammar clue:</b> '+c.g+'</div><div class="bottom"><div class="progress">Choose the conclusion that best fits ALL the evidence.</div><button type="button" class="next" id="next" style="display:none">'+(current===9?"See my result":"Next case →")+'</button></div></section>';
 screen.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>answer(Number(b.dataset.i))));
 screen.querySelector("#next").addEventListener("click",nextCase);
}
function answer(i){
 if(answered)return;answered=true;const c=cases[current],buttons=[...screen.querySelectorAll(".option")];
 buttons.forEach((b,n)=>{b.disabled=true;if(n===c.a)b.classList.add("correct");if(n===i&&n!==c.a)b.classList.add("wrong")});
 const f=screen.querySelector("#feedback");
 if(i===c.a){score++;f.className="feedback show good";f.innerHTML="<b>✓ Excellent detective work!</b><br>"+c.w}
 else{f.className="feedback show bad";f.innerHTML="<b>✗ Not quite.</b><br>"+c.w+"<br><br><b>Best answer:</b> "+c.o[c.a]}
 scoreEl.textContent="Score: "+score+" / 10";screen.querySelector("#next").style.display="inline-block";
}
function nextCase(){
 if(current<9){current++;render()}else finish();
}
function finish(){
 const rank=score>=9?"Master Detective 🕵️":score>=7?"Sharp Investigator 🔎":score>=5?"Junior Detective 📁":"Detective in Training 🧐";
 screen.innerHTML='<section class="result"><div class="eyebrow">CASE FILE CLOSED</div><div class="big">'+score+' / 10</div><div class="rank">'+rank+'</div><p>Look carefully at whether the evidence shows a <b>state/location</b> or an <b>activity in progress</b>.</p><button type="button" class="restart">Investigate again</button></section>';
 screen.querySelector(".restart").addEventListener("click",()=>{current=0;score=0;scoreEl.textContent="Score: 0 / 10";render()});
}
render();
</script>
</body>
</html>
