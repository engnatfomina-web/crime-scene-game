<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crime Scene Investigator — A2 Grammar Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e2d5;color:#20252b;font:16px Arial,sans-serif}
#game{max-width:900px;margin:auto;padding:24px}.top{background:#172331;color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:#e5c77b;margin-bottom:6px}h1{margin:0;font-size:30px}.score{border:1px solid #ffffff35;border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap}
.case{margin-top:18px;background:#fffdf7;border:1px solid #d8d0c2;border-radius:18px;padding:24px}.case-no{font-size:12px;letter-spacing:.16em;font-weight:900;color:#6d747b}
.scene{background:#eee8dc;border-left:4px solid #d6a84f;padding:15px 17px;border-radius:8px;line-height:1.55;margin:12px 0 20px}.question{font-size:19px;font-weight:800;margin-bottom:14px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{border:1px solid #d4cbbb;background:#fff;border-radius:11px;padding:14px;text-align:left;font-size:15px;line-height:1.4;cursor:pointer;min-height:58px}
.option.correct{border-color:#3f7656;background:#edf6f0}.option.wrong{border-color:#9b4b43;background:#f9eeee}.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:10px;background:#f0ece4;line-height:1.55}.feedback.show{display:block}.feedback.good{border-left:4px solid #3f7656}.feedback.bad{border-left:4px solid #9b4b43}
.grammar{margin-top:16px;background:#f7f3eb;border-radius:12px;padding:13px 15px;font-size:14px;color:#4e555c}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;flex-wrap:wrap}.progress{font-size:13px;color:#6d747b;font-weight:700}
.next,.restart{border:0;background:#172331;color:#fff;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.result{margin-top:18px;background:#172331;color:#fff;border-radius:18px;padding:32px;text-align:center}.big{font-size:48px;font-weight:900;color:#e5c77b}.rank{display:inline-block;background:#ffffff18;border-radius:20px;padding:7px 13px;font-weight:800;margin:8px 0 15px}.result p{line-height:1.6;color:#eee}
@media(max-width:650px){#game{padding:14px}.top{flex-direction:column;align-items:flex-start}h1{font-size:25px}.options{grid-template-columns:1fr}.case{padding:18px}}
</style></head>
<body><div id="game"><div class="top"><div><div class="eyebrow">CASE FILE • A2 GRAMMAR</div><h1>Crime Scene Investigator</h1></div><div class="score" id="score">Score: 0 / 10</div></div><div id="screen"></div></div>
<script>
const cases=[
["A kitchen window is broken. There is glass on the floor and a muddy footprint inside the kitchen. The front door is still locked.",["The burglar must have been outside.","The burglar must have been in the kitchen.","The burglar must have been looking for a way out.","The burglar must have been tired."],1,"The footprint is inside the kitchen, while the front door is locked.","must have been + place → a conclusion about a past location."],
["It is 10:00 p.m. The office is empty. At 10:05, a new email is sent from the office computer. When the detective arrives, the computer is still warm.",["Someone must have been using the computer.","Someone must have been waiting for the manager.","Someone must have been in the kitchen.","Someone must have been stealing the laptop."],0,"A new email was sent and the computer is warm. The evidence points to an activity in progress shortly before the detective arrived.","must have been + verb-ing → a conclusion about an activity in progress."],
["At 11:30 p.m., a security camera records a man entering the museum. Two minutes later, the alarm goes off. No one sees him leave.",["He must have been at home.","He must have been in the museum.","He must have been driving away.","He must have been waiting outside."],1,"The camera places him inside the museum immediately before the alarm. There is no evidence that he left.","must have been + place → a conclusion about a past location."],
["At 7:30 a.m., a neighbour sees a man get into a car and drive away. He does not go to work. The car is later found several kilometres away. The owner says he had not planned to go anywhere.",["The owner must have been driving to work.","The owner must have been driving to put petrol in the car.","Someone must have been stealing the car.","The owner must have been driving to buy some coffee."],2,"The owner says he had no plans, yet someone drove the car away and it was found elsewhere. Theft best explains all the clues.","must have been + verb-ing → an activity you infer from evidence."],
["It is raining heavily. A man arrives at a house. His coat and shoes are soaking wet, but the clothes underneath his coat are dry.",["He must have been exhausted.","He must have been wet.","He must have been in a hurry.","He must have been angry."],1,"His coat and shoes are soaking wet. We have direct evidence of his physical state.","must have been + adjective → a conclusion about a past state."],
["A security camera shows a man standing in front of a safe at 1:15 a.m. He is holding a key. At 1:17, the safe is open and the money is gone.",["He must have been checking the alarm.","He must have been opening the safe.","He must have been looking for his keys.","He must have been waiting for the police."],1,"He had the key, was standing at the safe, and two minutes later it was open. The evidence strongly points to him opening it.","must have been + verb-ing → an activity in progress in the past."],
["A man says he never entered the office. His phone is found inside a locked office. Security footage shows him entering at 8:45, and nobody else enters after him.",["He must have been in the office.","He must have been driving home.","He must have been waiting outside.","He must have been using his phone."],0,"The camera shows him entering and nobody else enters. His phone is also found inside. The evidence places him in the office.","must have been + place → a conclusion about a past location."],
["At 3:00 a.m., a security camera shows a person slowly opening the back door of a shop. The person looks around and then goes inside.",["The person must have been opening the back door.","The person must have been waiting for a friend.","The person must have been working at the shop.","The person must have been lost."],0,"The camera directly shows the person opening the back door and then entering.","must have been + verb-ing → an activity happening at that moment."],
["The police arrive at an empty house. A man’s coat and shoes are found in the bedroom. There are wet footprints leading from the bedroom to the front door.",["He must have been in the garden.","He must have been in the bedroom.","He must have been running away.","He must have been waiting for the police."],1,"His coat and shoes are in the bedroom, and the footprints begin there. The evidence places him in the bedroom before he left.","must have been + place → a conclusion about a past location."],
["At midnight, a neighbour sees a person behind the curtains. The lights are off. The person moves slowly and then disappears from the window.",["The person must have been hiding.","The person must have been sleeping.","The person must have been watching TV.","The person must have been getting ready for work."],0,"The person is behind closed curtains, in the dark, moving carefully, and disappears from view. Hiding is the best explanation.","must have been + verb-ing → an activity you infer from several clues."]
];
let n=0,score=0,answered=false;
const screen=document.getElementById("screen"),scoreEl=document.getElementById("score");
function render(){answered=false;let c=cases[n];screen.innerHTML='<section class="case"><div class="case-no">CASE '+String(n+1).padStart(2,"0")+' / 10</div><div class="scene"><b>Evidence report</b><br>'+c[0]+'</div><div class="question">What can the detective conclude?</div><div class="options">'+c[1].map((x,i)=>'<button class="option" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join("")+'</div><div id="feedback" class="feedback"></div><div class="grammar"><b>Grammar clue:</b> '+c[4]+'</div><div class="bottom"><div class="progress">Choose the conclusion that best fits ALL the evidence.</div><button class="next" id="next" style="display:none">'+(n===9?"See my result":"Next case →")+'</button></div></section>';
document.querySelectorAll(".option").forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.getElementById("next").onclick=nextCase}
function answer(i){if(answered)return;answered=true;let c=cases[n],bs=[...document.querySelectorAll(".option")];bs.forEach((b,j)=>{b.disabled=true;if(j===c[2])b.classList.add("correct");if(j===i&&j!==c[2])b.classList.add("wrong")});let f=document.getElementById("feedback");if(i===c[2]){score++;f.className="feedback show good";f.innerHTML="<b>✓ Excellent detective work!</b><br>"+c[3]}else{f.className="feedback show bad";f.innerHTML="<b>✗ Not quite.</b><br>"+c[3]+"<br><br><b>Best answer:</b> "+c[1][c[2]]}scoreEl.textContent="Score: "+score+" / 10";document.getElementById("next").style.display="inline-block"}
function nextCase(){if(n<9){n++;render()}else{let r=score>=9?"Master Detective 🕵️":score>=7?"Sharp Investigator 🔎":score>=5?"Junior Detective 📁":"Detective in Training 🧐";screen.innerHTML='<section class="result"><div class="eyebrow">CASE FILE CLOSED</div><div class="big">'+score+' / 10</div><div class="rank">'+r+'</div><p>Look carefully at whether the evidence shows a <b>state/location</b> or an <b>activity in progress</b>.</p><button class="restart">Investigate again</button></section>';document.querySelector(".restart").onclick=()=>{n=0;score=0;scoreEl.textContent="Score: 0 / 10";render()}}}
render();
</script></body></html>
